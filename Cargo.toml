[package]
name = "conductor"
version = "0.1.0"
authors = ["Kaitlyn Kenwell <redrield@gmail.com>"]
edition = "2018"
description = "A cross-platform driver station for FRC robots"
license-file = "LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
web-view = { git = "https://github.com/Boscop/web-view#82d7cbc.git" }
lazy_static = "1.4.0"
rust-embed = "6.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ds = "1.2.4"
gilrs = "0.10.4"
actix-web = "4.4.0"
mime_guess = "2.0.4"
futures = "0.3.28"
env_logger = "0.10.0"
actix-web-actors = "4.2.0"
actix = "0.13.0"
log = "0.4.20"
conquer-once = "0.2.1"
uuid = { version = "1.4.1", features = ["v4"] }
confy = "0.5.1"
autopilot = "0.4.0"
tinyfiledialogs = "3.9.0"
human-panic = "1.2.0"
glfw = "0.51.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.74"
x11 = { version = "2.18.2", features = ["xlib", "xinput", "xrandr"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.74"
core-graphics = "0.21.0"
objc = "0.2.7"
cocoa = "0.23.0"
block = "0.1.6"
core-foundation = "0.9.0"

[package.metadata.bundle]
name = "Conductor"
identifier = "io.github.Redrield.Conductor"
copyright = "MPL-2"

[package.metadata.rpm]
package = "conductor"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[package.metadata.rpm.targets]
conductor = { path = "/usr/bin/conductor" }
